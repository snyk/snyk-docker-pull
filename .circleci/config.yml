version: 2.1

orbs:
  node: circleci/node@5.1.0
  prodsec: snyk/prodsec-orb@1.1
  snyk: snyk/snyk@2
  slack: circleci/slack@4.12.1

defaults: &defaults
  resource_class: small
  docker:
    - image: cimg/node:20.15
  working_directory: ~/snyk-docker-pull

executors:
  docker: # Docker using the Base Convenience Image
    docker:
      - image: cimg/base:stable
  linux: # a Linux VM running Ubuntu 20.04
    machine:
      image: ubuntu-2004:202107-02

commands:
  install_deps:
    description: Install dependencies
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-cache-{{ checksum "package-lock.json" }}
            - v1-npm-cache-
      - run:
          name: Use snyk-main npmjs user
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: v1-npm-cache-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - persist_to_workspace:
          root: .
          paths:
            - node_modules/
  checkout_and_merge:
    steps:
      - checkout
      - run:
          name: Checkout main
          command: git checkout origin/main
      - run:
          name: Merge test branch
          command: |
            git config user.name "CircleCI"
            git config user.email "noop"
            git merge --no-edit "$CIRCLE_BRANCH"
      - attach_workspace:
          at: ~/snyk-docker-pull
  notify_slack_on_failure:
    steps:
      - slack/notify:
          branch_pattern: main
          channel: container-integration-deployment
          event: fail
          mentions: "@team-container-integration"
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "CICD pipeline failed :circleci-fail:",
                    "emoji": true
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*: ${CIRCLE_PROJECT_REPONAME}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Job*: ${CIRCLE_JOB}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch*: ${CIRCLE_BRANCH}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author*: ${CIRCLE_USERNAME}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Mentions*: ${SLACK_PARAM_MENTIONS}"
                    }
                  ],
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "emoji": true,
                      "text": "View Job"
                    },
                    "value": "${CIRCLE_BUILD_URL}"
                  }
                }
              ]
            }

jobs:
  install:
    <<: *defaults
    steps:
      - install_deps
  lint:
    <<: *defaults
    steps:
      - checkout
      - attach_workspace:
          at: ~/snyk-docker-pull
      - run:
          name: Run tests
          command: npm run lint
  security-scans:
    <<: *defaults
    steps:
      - checkout
      - attach_workspace:
          at: ~/snyk-docker-pull
      - prodsec/security_scans:
          mode: auto
      - notify_slack_on_failure
  test:
    parameters:
      node-version:
        type: string
    executor:
      name: linux
    steps:
      - checkout
      - attach_workspace:
          at: ~/snyk-docker-pull
      - node/install:
          node-version: << parameters.node-version >>
      - install_deps
      - run:
          name: Run tests
          command: npm test
  build:
    <<: *defaults
    steps:
      - checkout_and_merge
      - run:
          name: Use snyk-main npmjs user
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run tests
          command: npm run build
  release:
    <<: *defaults
    steps:
      - checkout_and_merge
      - run:
          name: Use snyk-main npmjs user
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Build
          command: npm run build
      - run:
          name: Release on GitHub
          command: npx semantic-release
workflows:
  version: 2
  test_and_release:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
          channel: team-integrations-alerts

      - install:
          name: Install
          context: nodejs-install

      - security-scans:
          name: Security Scans
          context:
            - analysis_integrations
          requires:
            - Install

      - lint:
          name: Lint
          context: nodejs-install
          requires:
            - Install
          filters:
            branches:
              ignore:
                - main
      - build:
          name: Build
          requires:
            - Security Scans
          filters:
            branches:
              ignore:
                - main
      - test:
          name: Test with node v<< matrix.node-version >>
          context: nodejs-install
          requires:
            - Install
          matrix:
            parameters:
              node-version: ["14.21", "16.19", "18.15"]
          filters:
            branches:
              ignore:
                - main

      - release:
          name: Release to GitHub
          context: nodejs-lib-release
          requires:
            - Security Scans
          filters:
            branches:
              only:
                - main
