version: 2.1

orbs:
  node: circleci/node@4.7

defaults: &defaults
  resource_class: small
  docker:
    - image: cimg/node:18.15.0
  working_directory: ~/snyk-docker-pull

executors:
  docker: # Docker using the Base Convenience Image
    docker:
      - image: cimg/base:stable
  linux: # a Linux VM running Ubuntu 20.04
    machine:
      image: ubuntu-2004:202107-02

commands:
  install_deps:
    description: Install dependencies
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-cache-{{ checksum "package-lock.json" }}
            - v1-npm-cache-
      - run:
          name: Use snyk-main npmjs user
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: v1-npm-cache-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - persist_to_workspace:
          root: .
          paths:
            - node_modules/
  checkout_and_merge:
    steps:
      - checkout
      - run:
          name: Checkout main
          command: git checkout origin/main
      - run:
          name: Merge test branch
          command: |
            git config user.name "CircleCI"
            git config user.email "noop"
            git merge --no-edit "$CIRCLE_BRANCH"
      - attach_workspace:
          at: ~/snyk-docker-pull

jobs:
  install:
    <<: *defaults
    steps:
      - install_deps
  lint:
    <<: *defaults
    steps:
      - checkout
      - attach_workspace:
          at: ~/snyk-docker-pull
      - run:
          name: Run tests
          command: npm run lint
  test:
    parameters:
      node_version:
        type: string
    executor:
      name: linux
    steps:
      - checkout
      - attach_workspace:
          at: ~/snyk-docker-pull
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run tests
          command: npm test
  build:
    <<: *defaults
    steps:
      - checkout_and_merge
      - run:
          name: Use snyk-main npmjs user
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run tests
          command: npm run build
  release:
    <<: *defaults
    steps:
      - checkout_and_merge
      - run:
          name: Use snyk-main npmjs user
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Build
          command: npm run build
      - run:
          name: Release on GitHub
          command: npx semantic-release
workflows:
  version: 2
  test_and_release:
    jobs:
      - install:
          name: Install
          context: nodejs-install
          filters:
            branches:
              ignore:
                - main
      - lint:
          name: Lint
          context: nodejs-install
          requires:
            - Install
          filters:
            branches:
              ignore:
                - main
      - build:
          name: Build
          requires:
            - Install
          filters:
            branches:
              ignore:
                - main
      - test:
          name: Test (Linux, Node v<< matrix.node_version >>)
          context: nodejs-install
          requires:
            - Install
          matrix:
            parameters:
              node_version: ['14.21', '16.19', '18.15']
          filters:
            branches:
              ignore:
                - main
      - release:
          name: Release to GitHub
          context: nodejs-lib-release
          filters:
            branches:
              only:
                - main


