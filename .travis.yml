dist: xenial
notifications:
  email: false
language: node_js
node_js:
  - "10"
before_install:
  - echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
cache: npm
jobs:
  include:
    - stage: Test
      script: npm test
    - stage: npm release
      if: branch = master AND type != pull_request
      node_js: "10"
      script: npx semantic-release
branches:
  only:
    - master
    - develop
